<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Escudo exterior -->
  <path d="M 100 20 L 180 60 L 180 140 Q 180 200 100 240 Q 20 200 20 140 L 20 60 Z" fill="none" stroke="black" stroke-width="3"/>
  
  <!-- Fondo amarillo superior -->
  <path d="M 35 75 L 165 75 L 165 135 L 100 155 L 35 135 Z" fill="#FFD700" stroke="black" stroke-width="2"/>
  
  <!-- Fondo verde inferior -->
  <path d="M 35 135 L 100 155 L 165 135 L 165 190 Q 165 220 100 245 Q 35 220 35 190 Z" fill="#00AA44" stroke="black" stroke-width="2"/>
  
  <!-- División central (cruz) -->
  <line x1="100" y1="75" x2="100" y2="155" stroke="black" stroke-width="2"/>
  <line x1="35" y1="115" x2="165" y2="115" stroke="black" stroke-width="2"/>
  
  <!-- Recuadros internos -->
  <rect x="45" y="82" width="45" height="28" fill="white" stroke="black" stroke-width="1.5"/>
  <rect x="110" y="82" width="45" height="28" fill="white" stroke="black" stroke-width="1.5"/>
  <rect x="45" y="122" width="45" height="28" fill="white" stroke="black" stroke-width="1.5"/>
  <rect x="110" y="122" width="45" height="28" fill="white" stroke="black" stroke-width="1.5"/>
  
  <!-- Engranaje central -->
  <circle cx="100" cy="115" r="8" fill="black"/>
  <circle cx="100" cy="115" r="5" fill="white"/>
  <!-- Dientes del engranaje -->
  <rect x="98" y="100" width="4" height="6" fill="black"/>
  <rect x="98" y="129" width="4" height="6" fill="black"/>
  <rect x="84" y="113" width="6" height="4" fill="black"/>
  <rect x="110" y="113" width="6" height="4" fill="black"/>
  
  <!-- Iconos en recuadros (simplificados) -->
  <!-- Recuadro superior izquierdo - Industria -->
  <path d="M 55 88 L 70 88 L 70 105 L 55 105 Z" stroke="black" stroke-width="1" fill="none"/>
  <line x1="60" y1="88" x2="60" y2="105" stroke="black" stroke-width="0.5"/>
  
  <!-- Recuadro superior derecho - Tecnología -->
  <rect x="115" y="90" width="8" height="10" stroke="black" stroke-width="1" fill="none"/>
  <rect x="128" y="88" width="10" height="12" stroke="black" stroke-width="1" fill="none"/>
  
  <!-- Recuadro inferior izquierdo - Espirales -->
  <path d="M 52 130 Q 55 128 58 130 Q 55 132 52 130" stroke="black" stroke-width="1" fill="none"/>
  <path d="M 62 130 Q 65 128 68 130 Q 65 132 62 130" stroke="black" stroke-width="1" fill="none"/>
  
  <!-- Recuadro inferior derecho - Moléculas -->
  <circle cx="125" cy="130" r="2" stroke="black" stroke-width="1" fill="black"/>
  <circle cx="135" cy="135" r="2" stroke="black" stroke-width="1" fill="black"/>
  <circle cx="130" cy="128" r="2" stroke="black" stroke-width="1" fill="black"/>
  <line x1="125" y1="130" x2="130" y2="128" stroke="black" stroke-width="0.5"/>
  <line x1="125" y1="130" x2="135" y2="135" stroke="black" stroke-width="0.5"/>
  
  <!-- Pluma/lápiz en la base -->
  <rect x="98" y="155" width="4" height="50" fill="black"/>
  <polygon points="100,205 96,210 104,210" fill="black"/>
  
  <!-- Texto superior -->
  <text x="100" y="35" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="black">DESARROLLO Y TECNOLOGÍA</text>
  
  <!-- Texto inferior -->
  <text x="100" y="270" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="black">POLITÉCNICO COLOMBIANO</text>
  <text x="100" y="285" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="black">Jaime Isaza Cadavid</text>
</svg>